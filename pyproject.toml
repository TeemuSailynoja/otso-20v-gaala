# The gala site: a build and a static page, not a published package.
#
# The library lives in ../ultiorg (see README: it is the client, parsers, corpus,
# fact store and analytics; this repo is the club config, the display names, the
# published JSON and the page). It is depended on by path so the two repos can be
# edited together while the site is being restructured; the git form is documented
# in the README and is what a deploy would use once the library has a remote.

[project]
name = "otso-20v-gaala"
version = "0.0.0"
description = "Otso's 20-year gala site: the build that turns Ultiorganizer data into site_data/, and the zero-build page that renders it"
requires-python = ">=3.11"
dependencies = [
    "ultiorg",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.uv]
# This repo is not a package: nothing here is built or installed, only run.
package = false

[tool.uv.sources]
ultiorg = { path = "../ultiorg", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
# site_contract.py sits at the repo root beside build_site_data.py, which is what
# writes the files it describes. The tests import it directly.
pythonpath = ["."]

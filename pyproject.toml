[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ultiorg"
version = "0.1.0"
description = "Cached client for Ultiorganizer (pelikone): players, matches, and point-by-point gameplay for any Finnish ultimate team"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "pyyaml>=6.0.3",
]

[project.scripts]
ultiorg = "ultiorg.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "network: hits the live Ultiorganizer instance (deselected by default)",
]
addopts = "-m 'not network'"
